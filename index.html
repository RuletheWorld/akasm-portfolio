<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Akasm</title>
  <meta name="description" content="Creative director portfolio — Raphael Merchant." />
  <meta property="og:title" content="Akasm" />
  <meta property="og:description" content="Creative director portfolio." />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0e0c0f;
      --glass: rgba(20, 18, 24, 0.55);
      --ink: rgba(255, 255, 255, 0.88);
      --muted: rgba(255, 255, 255, 0.54);
      --border: rgba(255, 255, 255, 0.14);
      --accent: #c8a6ff;
      --accent-2: #7af5d4;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html, body {
      height: 100%;
      margin: 0;
      background:
        radial-gradient(1640px 860px at 12% -8%, #2e2438 0%, transparent 58%),
        linear-gradient(180deg, #1b1922 0%, #0e0c0f 60%, #2e2438 120%);
      color: var(--ink);
      font-family: Manrope, "SF Pro Text", "Inter", "Helvetica Neue", system-ui, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .frame {
      position: relative;
      width: 100%;
      max-width: 1400px;
      border-radius: 2px;
      overflow: hidden;
      padding: 14px;
      background:
        linear-gradient(#0e0c0f,#0e0c0f) padding-box,
        linear-gradient(#212025,#1c1a1f) border-box;
      border: 1px solid var(--border);
      box-shadow:
        0 24px 56px -16px rgba(0, 0, 0, 0.7),
        0 0 80px -28px rgba(120, 100, 160, 0.28);
    }

    .bg {
      position: absolute;
      left: 14px; top: 14px; right: 14px; bottom: 14px;
      border-radius: 2px;
      overflow: hidden;
      z-index: 0;
      background:
        radial-gradient(1420px 720px at 14% 0%, rgba(255,255,255,0.16) 0%, transparent 56%),
        linear-gradient(180deg, rgba(28,26,33,0.96), rgba(10,9,12,0.74));
      backdrop-filter: saturate(130%) brightness(0.92);
      -webkit-backdrop-filter: saturate(130%) brightness(0.92);
    }

    .bg::before {
      content: "";
      position: absolute;
      left: 12%; top: 0; right: 40%;
      height: 46%;
      background: linear-gradient(0deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 100%);
      filter: blur(14px);
      opacity: 0.9;
      pointer-events: none;
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(rgba(255,255,255,0.019) 0 1px, transparent 1px 2px),
        linear-gradient(rgba(255,255,255,0.03), transparent 48%);
      pointer-events: none;
    }

    .sheen {
      position: absolute;
      left: 14px; top: 14px; right: 14px; bottom: 14px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.11) 0%, transparent 26%),
        linear-gradient(0deg, rgba(255,255,255,0.05), transparent 44%);
      opacity: 0.44;
    }

    .inner {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 26px 28px 36px;
    }

    .top { display: flex; align-items: flex-start; justify-content: space-between; min-height: 112px; }
    .home-blob {
      width: min(28vw, 520px);
      height: auto;
      opacity: 0.96;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-size: 11px;
      margin: 0;
    }
    .mark {
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-weight: 700;
      font-size: 13px;
      opacity: 0.9;
    }

    .mid { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }

    .panel {
      position: relative;
      width: min(42vw, 720px);
      color: rgba(255, 255, 255, 0.86);
      transform: translateY(14px);
      opacity: 0;
    }
    .panel-head {
      margin: 0 0 14px;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.62);
    }
    .paragraph {
      margin: 0 0 18px;
      line-height: 1.5;
      font-size: 15px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.18);
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
    }
    .cta:hover { background: rgba(255,255,255,0.14); }

    .nav-card {
      position: relative;
      min-width: 180px;
      border-radius: 10px;
      background: rgba(22, 20, 26, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 14px 30px -12px rgba(0, 0, 0, 0.75),
        inset 0 0 18px rgba(255,255,255,0.06);
      padding: 14px 12px 14px;
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      cursor: pointer;
      color: var(--ink);
      text-align: left;
      appearance: none;
      font-family: inherit;
    }
    .nav-card[aria-pressed="true"] { background: rgba(32, 28, 40, 0.85); border-color: rgba(255,255,255,0.32); }
    .nav-card .row-b { display: flex; align-items: center; gap: 10px; }
    .knob {
      width: 8px; height: 8px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 0 2px rgba(255,255,255,0.22), 0 0 10px rgba(120, 110, 180, 0.55);
    }
    .nav-card .label { letter-spacing: 0.08em; font-size: 13px; }

    .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
    .title {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
    }
    .subtitle {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .meta {
      color: rgba(255,255,255,0.5);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .panel-enter { animation: reveal 0.54s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .panel-leave { animation: hide 0.36s cubic-bezier(0.64, 0, 0.78, 0) both; }
    @keyframes reveal { from { transform: translateY(18px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes hide { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-10px); opacity: 0; } }

    @media (max-width: 720px) {
      .home-blob { width: 55vw; }
      .frame { padding: 10px; }
      .inner { padding: 18px 22px 28px; }
      .panel { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="bg" aria-hidden="true"></div>
    <div class="sheen" aria-hidden="true"></div>
    <div class="inner">
      <div class="top">
        <svg class="home-blob" viewBox="0 0 480 320" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 52 260 C 44.5 228 34 206 25.1 172.5 C 12.2 135.5 5.4 99.9 -12 72 C -30.6 37 -51 8.7 -91 1.8 C -134.6 -4.8 -185.5 16.66 -206 61.6 C -225.8 100.4 -210 151 -199 180 C -187.4 209.3 -185.5 239.6 -166 264.5 C -144 286.3 -112.8 322.6 -83 281.6 C -54.7 243.1 -58.6 211.1 -52 260 Z" fill="url(#gA)" transform="translate(240, 18)"/>
          <defs>
            <radialGradient id="gA" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="matrix(0.26 0 0 0.48 0 0.52)">
              <stop offset="0" stop-color="white" stop-opacity="0.22"/>
              <stop offset="0.6" stop-color="#b8b5ff" stop-opacity="0.06"/>
              <stop offset="1" stop-color="white" stop-opacity="0"/>
            </radialGradient>
          </defs>
        </svg>
        <div>
          <div class="mark">AKASM</div>
          <div class="eyebrow">Art Direction · Photography</div>
        </div>
      </div>

      <div class="mid">
        <div class="panel" id="panel">
          <h2 class="panel-head" id="panel-hed">Public</h2>
          <p class="paragraph" id="panel-body" style="transition:opacity .22s ease, transform .28s ease;">Creative direction and photography work by Raphael Merchant — Mississauga, ON.</p>
          <a class="cta" id="panel-cta" href="https://be.net/akasm" target="_blank" rel="noopener">
            Review work on Behance
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 10L10 2M10 2H3.5M10 2v6.5" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>

        <button class="nav-card" id="nav" aria-haspopup="true" aria-expanded="false" aria-controls="panel">
          <div class="row-b"><span class="knob" aria-hidden="true"></span><span class="label">Contents</span></div>
          <svg id="chev-row" style="margin-top:10px;display:block" width="16" height="16" viewBox="0 0 16 16"><path d="M11.7 6.3a1 1 0 0 1 0 1.4l-4 4a1 1 0 0 1-1.4-1.4L10.3 8 6.3 4a1 1 0 0 1 1.4-1.4z" fill="rgba(255,255,255,0.75)"/></svg>
        </button>
      </div>

      <div class="bottom">
        <div>
          <div class="title">Raphael Merchant</div>
          <div class="subtitle">Creative Director · Visual &amp; Content Lead</div>
        </div>
        <div class="meta">Mississauga, ON</div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const nav = document.getElementById('nav');
      const panel = document.getElementById('panel');
      const chev = document.getElementById('chev-row');
      const hed = document.getElementById('panel-hed');
      const body = document.getElementById('panel-body');
      const cta = document.getElementById('panel-cta');

      let open = false;
      const items = [
        { label: 'Public', body: 'Creative direction and photography work by Raphael Merchant — Mississauga, ON.', cta: { t: 'Review work on Behance', href: 'https://be.net/akasm' } },
        { label: 'Process', body: 'Resolution is built before exposure. Every final is the result of deliberate constraints — light, angle, and surface.', cta: { t: 'See the work on Behance', href: 'https://be.net/akasm' } },
        { label: 'Contact', body: 'Available for select clients and collaborations. Most effective when engaged early.', cta: { t: 'Start a conversation', href: 'mailto:raph@shortermerchant.com' } }
      ];
      let idx = 0;

      function revealContent(item, dir) {
        const enter = document.createElement('span');
        const leave = document.createElement('span');
        enter.textContent = item.body;
        panel.appendChild(enter);
        enter.style.display = 'inline-block';
        enter.style.transform = dir > 0 ? 'translateY(14px)' : 'translateY(-14px)';
        enter.style.opacity = '0';
        enter.style.transition = 'transform 0.28s ease, opacity 0.24s ease';

        gsap.to(enter, { y: 0, opacity: 1, duration: 0.28, ease: 'power2.out', overwrite: true });
        if (leave.parentNode) {
          gsap.to(leave, { y: 10, opacity: 0, duration: 0.22, ease: 'power2.in', overwrite: true, onComplete: () => leave.remove() });
        }
        enter.addEventListener('transitionend', () => { if (leave.parentNode) leave.remove(); }, { once: true });
      }

      function switchItem(delta) {
        const next = (idx + delta + items.length) % items.length;
        const leave = document.createElement('span');
        leave.textContent = body.textContent;
        panel.appendChild(leave);
        leave.style.display = 'inline';
        leave.style.position = 'absolute';
        leave.style.left = '0';
        leave.style.top = '32px';

        idx = next;
        hed.textContent = items[idx].label;
        cta.textContent = items[idx].cta.t;
        cta.setAttribute('href', items[idx].cta.href);
        revealContent(items[idx], delta > 0 ? 1 : -1);

        chev.setAttribute('transform', 'rotate(180 8 8)');
        setTimeout(() => chev.removeAttribute('transform'), 260);
      }

      function fitText() {
        const max = 268;
        if (window.innerWidth < max) {
          panel.style.maxWidth = (window.innerWidth - 36) + 'px';
        } else {
          panel.style.maxWidth = '440px';
        }
      }

      function animateOpen() {
        const x = parseInt(getComputedStyle(panel).left, 10);
        const action = gsap.timeline();
        action.set(panel, { left: x - 22, opacity: 0, y: 10 });
        action.to(panel, { left: x, opacity: 1, y: 0, duration: 0.52, ease: 'expo.out' });
      }
      function animateClose() {
        const x = parseInt(getComputedStyle(panel).left, 10);
        const action = gsap.timeline({ onComplete: () => { panel.style.opacity = '0'; } });
        action.to(panel, { left: x - 22, opacity: 0, y: 12, duration: 0.38, ease: 'expo.in' });
      }

      fitText();
      window.addEventListener('resize', fitText);

      nav.addEventListener('click', (event) => {
        event.preventDefault();
        open = !open;
        nav.setAttribute('aria-pressed', String(open));
        nav.setAttribute('aria-expanded', String(open));
        if (open) {
          panel.style.visibility = 'visible';
          panel.style.opacity = '1';
          panel.style.display = 'block';
          animateOpen();
        } else {
          animateClose();
        }
      });

      panel.addEventListener('wheel', (event) => {
        if (event.deltaY > 0) switchItem(-1);
        else switchItem(1);
      }, { passive: true });

      panel.addEventListener('transitionend', function handler(e) {
        if (e.propertyName !== 'transform') return;
        if (open && parseInt(getComputedStyle(panel).opacity, 10) === 0 && event && event.target && event.target.tagName === 'SPAN') return;
        if (!open && event && event.target && event.target.tagName !== 'SPAN') return;
        if (!open) {
          gsap.set(panel, { clearProps: 'transform' });
          panel.style.display = 'none';
        }
      }, { once: false });
    })();
  </script>
</body>
</html>
